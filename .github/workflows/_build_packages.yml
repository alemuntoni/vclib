name: Reusable Build VCLib Packages

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        description: "The commit SHA or ref to checkout. Defaults to the workflow trigger ref."

jobs:
  build_vclib_packages:
    name: Build VCLib Package (${{ matrix.os }}, ${{ matrix.package_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-26.04', 'ubuntu-26.04-arm', 'macos-26-intel', 'macos-latest', 'windows-latest']
        package_type: ['core', 'all']
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: ${{ inputs.ref }}

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      if: runner.os == 'Windows'
      with:
        arch: x64

    - name: Install Qt
      uses: ./.github/actions/install-qt

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install cmake ninja-build libtbb-dev
        sudo apt-get install libembree-dev
        sudo apt-get install freeglut3-dev libgl1-mesa-dev libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev libgmp-dev libmpfr-dev libwayland-dev wayland-protocols libxkbcommon-dev mesa-vulkan-drivers

    - name: Install dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install cmake ninja
        brew install embree gmp mpfr

    - name: Install dependencies
      if: runner.os == 'Windows'
      shell: bash
      run: |
        choco install -y cmake ninja

    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: package-${{ matrix.os }}-${{ matrix.package_type }}
        max-size: 1G

    - name: Build and Install VCLib
      shell: bash
      run: |
        PRESET="vclib-${{ matrix.package_type }}-install"
        cmake -S . -B build-vclib --preset=$PRESET \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build-vclib
        cmake --install build-vclib --prefix "${{ github.workspace }}/install-vclib"

    - name: Build VCLib Installer (Windows NSIS)
      if: matrix.package_type == 'all' && runner.os == 'Windows'
      shell: bash
      run: |
        cpack --config build-vclib/CPackConfig.cmake -B packages
        mkdir -p dist_installer
        cp packages/*.exe dist_installer/

    - name: Upload VCLib Package
      uses: actions/upload-artifact@v7
      with:
        name: vclib-package-${{ matrix.package_type }}-${{ runner.os }}-${{ runner.arch }}
        path: install-vclib
        include-hidden-files: true

    - name: Upload VCLib Installer (Windows NSIS)
      if: matrix.package_type == 'all' && runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: vclib-installer-${{ runner.os }}-${{ runner.arch }}
        path: dist_installer/*

  build_vclib_deb:
    name: Build VCLib DEB Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-26.04', 'ubuntu-26.04-arm']
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: ${{ inputs.ref }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libtbb-dev libembree-dev libgmp-dev libmpfr-dev
        sudo apt-get install -y freeglut3-dev libgl1-mesa-dev libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev libwayland-dev wayland-protocols libxkbcommon-dev mesa-vulkan-drivers
        sudo apt-get install -y libeigen3-dev libboost-dev libcgal-dev libglfw3-dev qt6-base-dev

    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: deb-${{ matrix.os }}
        max-size: 1G

    - name: Build and Package VCLib DEB
      shell: bash
      run: |
        cmake -S . -B build-deb --preset=vclib-all-install \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build-deb
        cpack --config build-deb/CPackConfig.cmake -G DEB -B packages
        mkdir -p dist_installer
        cp packages/*.deb dist_installer/

    - name: Upload VCLib DEB Package
      uses: actions/upload-artifact@v7
      with:
        name: vclib-installer-${{ runner.os }}-${{ runner.arch }}
        path: dist_installer/*

